<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Putt-Pocalypse</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <canvas id="gameCanvas"></canvas>

        <div id="startScreen" class="gameOverlay">
            <div class="titleBackdrop"></div>

            <div class="menuCard titleCard">
                <div class="titleKicker">
                    The dead have risen.
                    Tee time is still at nine.
                </div>

                <h1 class="gameTitle">
                    <span class="puttWord">Putt</span><span class="dashWord">-</span><span class="pocalypseWord">Pocalypse!</span>
                </h1>

                <div class="titleDivider">
                    <span></span>
                    <div class="golfBallMark">⛳</div>
                    <span></span>
                </div>

                <p class="titleTagline">
                    Sink putts. Dodge zombies. Survive the course.
                </p>

                <div class="menuActions">
                    <button id="startGameButton" class="primaryMenuButton">
                        Start
                    </button>

                    <button id="devStartGameButton" class="devMenuButton">
                        Dev Start
                    </button>
                </div>

                <div class="menuHint">
                    Dev Start enables testing controls and the developer HUD.
                </div>
            </div>
        </div>

        <button id="pauseGameButton" class="pauseCornerButton hidden">
            Pause
        </button>

        <div id="pausePanel" class="gameOverlay hidden">
            <div class="menuCard pauseCard">
                <div class="pauseEyebrow">Round Suspended</div>
                <h2>Paused</h2>

                <div class="pauseBall">●</div>

                <div class="menuActions pauseActions">
                    <button id="resumeGameButton" class="primaryMenuButton">
                        Continue
                    </button>

                    <button id="pauseResetButton">
                        Reset Hole
                    </button>

                    <button id="exitToMenuButton" class="dangerMenuButton">
                        Exit to Menu
                    </button>
                </div>

                <div class="menuHint">
                    Press Esc or P to continue.
                </div>
            </div>
        </div>

        <div id="holeCompletePanel" class="hidden">
            <div class="resultsCard">
                <h2 id="holeCompleteTitle">
                    Hole Complete
                </h2>

                <p id="holeCompleteName"></p>

                <div class="scoreRow">
                    <span>Par</span>
                    <span id="holeCompletePar">0</span>
                </div>

                <div class="scoreRow">
                    <span>Strokes</span>
                    <span id="holeCompleteStrokes">0</span>
                </div>

                <div
                    id="holeCompleteResult"
                    class="scoreResult"
                >
                    Par
                </div>

                <button id="continueButton">
                    Continue
                </button>
            </div>
        </div>

        <div id="developerControls">
            <button id="previousHoleButton">
                Previous Hole
            </button>

            <button id="nextHoleButton">
                Next Hole
            </button>

            <button id="resetButton">
                Reset Hole
            </button>

            <button id="switchClubButton">
                Switch Club
            </button>
        </div>
        
        <script src="js/globals.js"></script>
        <script src="js/gamestate.js"></script>
        <script src="js/input.js"></script>
        <script src="js/clubs.js"></script>
        <script src="js/audio.js"></script>
        <script src="js/player.js"></script>
        <script src="js/equipped-club-visual.js"></script>
        <script src="js/hole.js"></script>
        <script src="js/windmill-animation.js"></script>
        <script src="js/ball.js"></script>
        <script src="js/windmill-physics.js"></script>
        <script src="js/windmill-safety-tuning.js"></script>
        <script src="js/tunnel-and-club-safety.js"></script>
        <script src="js/zombie.js"></script>
        <script src="js/forced-movement-collisions.js"></script>
        <script src="js/camera.js"></script>
        <script src="js/world.js"></script>
        <script src="js/player-boundary-and-redesign.js"></script>
        <script src="js/zombie-debug-and-circular-golfer.js"></script>
        <script src="js/game.js"></script>
        <script src="js/golfer-combat.js"></script>
        <script src="js/developer-controls.js"></script>
        <script src="js/menu-and-pause.js"></script>
    </body>
</html>
